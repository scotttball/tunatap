name: Go Vulnerability Check

on:
  # Weekly scan on Mondays at midnight UTC
  schedule:
    - cron: '0 0 * * 1'
  # Manual trigger
  workflow_dispatch:
  # Run on PRs that modify go.mod/go.sum
  pull_request:
    paths:
      - 'go.mod'
      - 'go.sum'

permissions:
  contents: read
  security-events: write

jobs:
  govulncheck:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: |
          govulncheck -format sarif ./... > govulncheck-raw.sarif 2>&1 || true
          # Deduplicate tags in SARIF rules to satisfy GitHub's strict schema validation
          python3 -c "
          import json
          with open('govulncheck-raw.sarif') as f:
              data = json.load(f)
          for run in data.get('runs', []):
              for rule in run.get('tool', {}).get('driver', {}).get('rules', []):
                  tags = rule.get('properties', {}).get('tags', [])
                  if tags:
                      rule['properties']['tags'] = list(dict.fromkeys(tags))
          with open('govulncheck.sarif', 'w') as f:
              json.dump(data, f)
          " 2>/dev/null || cp govulncheck-raw.sarif govulncheck.sarif

      - name: Display results
        run: |
          echo "### Vulnerability Scan Results" >> $GITHUB_STEP_SUMMARY
          govulncheck ./... 2>&1 | tee -a $GITHUB_STEP_SUMMARY || true

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: govulncheck.sarif
